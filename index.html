function active(row,year){return year==='all'||(Number(year)>=row.start&&Number(year)<=(row.end??9999));}

function dateValid(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&!Number.isNaN(Date.parse(value))&&new Date(value+'T00:00:00Z').toISOString().slice(0,10)===value;}
function validateSourceDates(e,observation){if(!dateValid(e.published)||!dateValid(e.collected)||!dateValid(observation)||e.published>e.collected||e.collected>observation)throw new Error('来源日期必须满足：发布日期 ≤ 采集日期 ≤ 观察日；禁止未来材料发布。');}

function queryMatches(db,q={}){

 if(text&&!combat&&!chief&&!leader&&!([p.name,...(p.aliases||[]),...primary.map(j=>j.role+' '+db.projects.find(g=>g.id===j.projectId).name)].join(' ').includes(text)))return [];
 const conditions=[q.company&&'公司',q.project&&'项目',q.year&&'时期',q.capability&&q.capability,combat&&'战斗职责',leader&&'组长头衔'].filter(Boolean);
 const make=(label,rows,withCaps)=>({label,jobIds:rows.map(j=>j.id),evidenceIds:[...new Set(rows.flatMap(j=>[...j.evidenceIds.filter(id=>sourceUsable(db,db.evidence.find(e=>e.id===id))),...(leader?(j.roleHistory||[]).filter(h=>(!q.year||active(h,q.year))&&supported(db,h)).flatMap(h=>h.evidenceIds):[]),...(withCaps?capabilitiesFor(db,j).filter(c=>(combat&&c.domain==='战斗体系')||c.domain===q.capability).flatMap(c=>c.evidenceIds):[])]))]});

const LONGLIST_PRESETS=[
 {id:'chief-combat',title:'主策（需战斗背景）',domains:['战斗体系'],minScope:2,chief:true,genre:''},
 {id:'combat-lead',title:'战斗策划负责人',domains:['战斗体系'],minScope:3,chief:false,genre:'动作'},
 {id:'economy-lead',title:'数值 / 经济负责人',domains:['经济系统'],minScope:3,chief:false,genre:''},
 {id:'world-lead',title:'世界与内容负责人',domains:['世界与内容'],minScope:3,chief:false,genre:'开放世界'},
 {id:'social-lead',title:'社交与帮会负责人',domains:['社交与帮会'],minScope:3,chief:false,genre:''}];
const LONGLIST_GENRES=['',...Object.values(GENRE).flatMap(g=>[g,g.replace(/ MMORPG$/,'')])];
function longlistNeed(need){
 if(!need||typeof need!=='object'||Array.isArray(need)||![Object.prototype,null].includes(Object.getPrototypeOf(need)))throw new Error('need 须为 JSON 纯数据需求对象');
 const keys=['domains','chief','minScope','genre','id','title','preset'];
 for(const k of Reflect.ownKeys(need)){
  if(typeof k!=='string'||!keys.includes(k))throw new Error('未知需求字段：'+String(k));
  if(!Object.hasOwn(Object.getOwnPropertyDescriptor(need,k),'value'))throw new Error('need 仅接受 JSON 纯数据，不接受访问器');
  if(['id','title','preset'].includes(k)){if(typeof need[k]!=='string')throw new Error(k+' 须为纯文本');plain(need[k]);}
 }
 const domains=Object.hasOwn(need,'domains')?need.domains:[],chief=Object.hasOwn(need,'chief')?need.chief:false,min=Object.hasOwn(need,'minScope')?need.minScope:1,genre=Object.hasOwn(need,'genre')?need.genre:'';

 if(typeof chief!=='boolean')throw new Error('chief 须为布尔值');
 if(!Number.isInteger(min)||min<1||min>4)throw new Error('minScope 须为 1–4 的整数');
 if(typeof genre!=='string'||!LONGLIST_GENRES.includes(genre))throw new Error('genre 须为已知项目类型偏好，或空字符串（不限）');
 if(!domains.length&&!chief)throw new Error('请至少选择一项能力域，或勾选“需做过主策”。');

}
function longlistHit(label,j,claims,scopeClaims=[]){

 return {label,jobId:j.id,projectId:j.projectId,claimIds:[...new Set(all.map(c=>c.id))],evidenceIds:[...new Set(all.map(c=>c.sourceId))],scopeClaimIds:[...new Set(scopeClaims.map(c=>c.id))],scopeEvidenceIds:[...new Set(scopeClaims.map(c=>c.sourceId))]};

function explainLonglist(db,need={}){

 // 任期排序和范围判定均读取有效字段，隔离来源后不沿用记录上的旧值。
 const all=M.publishedJobs(db).map(j=>({...j,start:M.fieldClaims(db,j.id,'start').at(-1)?.value??0,end:M.fieldClaims(db,j.id,'end').at(-1)?.value??null}));
 const genreMatches=j=>!genre||!!project(db,j.projectId)?.genre?.includes(genre),out=[];
 for(const p of people){
  const js=all.filter(j=>j.personId===p.id),hits=[],reasons=[],checks=new Set();let met=0,scope=0,hard=true,chiefJob=null;
  const reason=(code,kind,label,domain)=>reasons.push({code,kind,label,...(domain?{domain}:{})});
  if(!js.length)reason('no_published_jobs','missing_evidence','没有可用的已发布任职证据（缺证不等于没有能力）');
  for(const d of domains){
   const rows=js.flatMap(j=>M.capabilitiesFor(db,j).filter(c=>c.domain===d).map(c=>{
    const claims=M.fieldClaims(db,j.id,'capability.domain').filter(f=>f.capabilityId===c.id&&f.value===d&&c.evidenceIds.includes(f.sourceId));
    const scopeClaims=M.fieldClaims(db,j.id,'capability.scope').filter(f=>f.capabilityId===c.id&&f.value===c.scope&&c.evidenceIds.includes(f.sourceId));
    const rank=scopeClaims.length?scopeRank(c.scope):0;

   })).sort((a,b)=>Number(b.preferred)-Number(a.preferred)||b.rank-a.rank||b.j.start-a.j.start);
   if(!rows.length){hard=false;reason('missing_domain:'+d,'missing_evidence',`缺少「${d}」的职责证据（缺证不等于没有能力）`,d);continue;}

   if(best.rank<min){hard=false;reason((best.rank?'insufficient_scope:':'missing_scope:')+d,best.rank?'below_requirement':'missing_evidence',best.rank?`「${d}」最高责任范围为「${best.c.scope}」，低于要求的「${SCOPE_LABEL[min]}」`:`「${d}」缺少可判定责任范围的有效字段证据，尚不能确认达到「${SCOPE_LABEL[min]}」（缺证不等于没有能力）`,d);}

   if(chiefJob)hits.push(longlistHit('主策任职',chiefJob,M.fieldClaims(db,chiefJob.id,'role').filter(c=>c.value==='主策')));
   else{hard=false;reason('missing_chief','missing_evidence','没有已发布的主策任职证据（缺证不等于没有经历）');}
  }

  for(const h of hits){const j=js.find(x=>x.id===h.jobId);if(j.end===null)checks.add('结束时间未知：核验当前是否仍在该项目');if(M.fieldClaims(db,j.id,'end').some(c=>c.basis==='推定边界'))checks.add('任期末年为推定边界：核验实际离任时间');if(h.evidenceIds.length<2)checks.add('命中经历仅单一来源：补充独立来源');}
  if(js.length&&js.every(j=>j.end!==null))checks.add('最近任职已结束且去向未收录：先核实现状');
  checks.add('求职意向未知：不作推断，接触前由招聘同事评估');

   const group=distribution.get(r.code);
   if(!group.personIds.includes(row.personId))group.personIds.push(row.personId);
  }

 const gapDistribution=[...distribution.values()].map(g=>({...g,count:g.personIds.length,personIds:g.personIds.sort()}));
 return {rows:out,tiers,gapDistribution,totalPeople,evaluatedPeople:out.length,notice:'仅解释当前样本库的已发布任职与有效字段证据；已解释人数含无有效任职的 C 层。C 层表示未进入 A/B，不代表能力不合格；缺证不等于没有能力。责任范围不足仅指已收录证据低于本次要求；项目类型仅为偏好，不作淘汰。各原因按人去重，分母为总库去重人数；同一人可有多个原因，多原因人数不可相加。不能据此推断市场没人或 JD 过严；求职意向未知。'};
}
function longlist(db,need={}){
 return explainLonglist(db,need).rows.filter(r=>r.tier!=='C').map(({reasons,...row})=>row);

 log(db,'研判更新',`${e.title} · ${next.priority}`,[{objectId:next.id,field:'信号 / 判断 / 行动（判断层）',old:old?clone(old):null,new:clone(next),effective:'仅判断层；不修改任何事实'}],e.evidenceIds);

const usable=(db,ids)=>[...new Set((ids||[]).filter(id=>M.sourceUsable(db,db.evidence.find(e=>e.id===id))))];
function liveScope(db,j,c){return M.fieldClaims(db,j.id,'capability.scope').some(f=>f.capabilityId===c.id&&f.value===c.scope&&c.evidenceIds.includes(f.sourceId))?M.scopeRank(c.scope):0;}

function persona(db,pid){

 const js=M.publishedJobs(db).filter(j=>j.personId===pid).sort((a,b)=>a.start-b.start);
 const caps=js.flatMap(j=>M.capabilitiesFor(db,j).map(c=>({j,c,rank:liveScope(db,j,c),year:j.start})));
 const byDomain=[...new Set(caps.map(x=>x.c.domain))].map(d=>{const rows=caps.filter(x=>x.c.domain===d).sort((a,b)=>b.rank-a.rank);const best=rows[0];
  return {domain:d,topScope:best.rank?best.c.scope:'责任范围待核验',rank:best.rank,jobIds:rows.map(x=>x.j.id),evidenceIds:usable(db,rows.flatMap(x=>x.c.evidenceIds))};}).sort((a,b)=>b.rank-a.rank);

 const companies=[...new Set(js.map(j=>db.projects.find(g=>g.id===j.projectId)?.companyId).filter(Boolean))];
 const entry=caps.filter(x=>x.rank===1).sort((a,b)=>a.year-b.year)[0],lead=caps.filter(x=>x.rank>=2).sort((a,b)=>a.year-b.year)[0];
 const growth=entry&&lead&&lead.year>entry.year?{fromYear:entry.year,toYear:lead.year,years:lead.year-entry.year,fromScope:entry.c.scope,toScope:lead.c.scope,jobIds:[entry.j.id,lead.j.id]}:null;
 const closed=js.filter(j=>j.end!==null);
 const tenure=closed.length?{closed:closed.length,avgYears:+(closed.reduce((s,j)=>s+(j.end-j.start+1),0)/closed.length).toFixed(1)}:null;
 const single=js.filter(j=>usable(db,j.evidenceIds).length<2).length,inferred=js.filter(j=>M.fieldClaims(db,j.id,'end').some(c=>c.basis==='推定边界')).length,open=js.filter(j=>j.end===null).length;

 if(open)limits.push('结束时间未知只代表最近已知，不确认仍在职。');
 if(pend.length)limits.push(`另有 ${pend.length} 段待核验任职未计入画像（例如身份或职级存在冲突）。`);
 if(tenure&&tenure.closed<2)limits.push('已结束任职不足 2 段，平均任期只能作为参考。');

  quality:{total:js.length,singleSource:single,inferredEnd:inferred,openEnd:open},limits};
}

/* ---------- organisation diagnosis (structure only, never intent) ---------- */
const BENCH={0:'未收录证据',1:'样本内单点'};
function bench(db){

 return db.projects.map(p=>({project:p,cells:M.DOMAINS.map(d=>{
  const hits=js.filter(j=>j.projectId===p.id).flatMap(j=>M.capabilitiesFor(db,j).filter(c=>c.domain===d).map(c=>({j,c})));
  const people=new Set(hits.map(h=>h.j.personId)),leads=new Set(hits.filter(h=>liveScope(db,h.j,h.c)>=2).map(h=>h.j.personId));
  return {domain:d,people:people.size,leads:leads.size,level:BENCH[leads.size]||'样本内有厚度',personIds:[...people],leadIds:[...leads]};})}));
}
function singlePoints(db){
 return bench(db).flatMap(r=>r.cells.filter(c=>c.leads===1).map(c=>{const pid=c.leadIds[0],j=M.publishedJobs(db).find(j=>j.personId===pid&&j.projectId===r.project.id&&M.capabilitiesFor(db,j).some(x=>x.domain===c.domain&&liveScope(db,j,x)>=2));
  return {projectId:r.project.id,domain:c.domain,personId:pid,jobId:j?.id||null,evidenceIds:j?usable(db,j.evidenceIds):[]};}));
}
function coverage(db){
 return bench(db).map(r=>{const covered=r.cells.filter(c=>c.people>0).map(c=>c.domain),missing=r.cells.filter(c=>!c.people).map(c=>c.domain);
  return {projectId:r.project.id,project:r.project,covered,missing,pct:Math.round(covered.length/M.DOMAINS.length*100)};});
}
function pyramid(db){
 const top=new Map();
 for(const j of M.publishedJobs(db))for(const c of M.capabilitiesFor(db,j)){const r=liveScope(db,j,c);if(r>(top.get(j.personId)?.rank??0))top.set(j.personId,{rank:r,scope:c.scope});}
 return [4,3,2,1].map(rank=>{const ids=[...top].filter(([,v])=>v.rank===rank).map(([k])=>k);
  return {rank,label:M.SCOPE_LABEL[rank],people:ids.length,personIds:ids};});
}
// Overlapping cross-project stints are usually secondment, not a move. Flow charts misread them.
function concurrent(db){
 const byP={};for(const j of M.publishedJobs(db))(byP[j.personId]=byP[j.personId]||[]).push(j);
 const out=[];
 for(const [pid,list] of Object.entries(byP))for(let i=0;i<list.length;i++)for(let k=i+1;k<list.length;k++){
  const a=list[i],b=list[k];if(a.projectId===b.projectId)continue;
  const lo=Math.max(a.start,b.start),hi=Math.min(a.end??9999,b.end??9999);
  if(lo<=hi)out.push({personId:pid,jobIds:[a.id,b.id],projectIds:[a.projectId,b.projectId],years:[lo,Math.min(hi,+db.observationDate.slice(0,4))],evidenceIds:usable(db,[...a.evidenceIds,...b.evidenceIds])});}
 return out;
}
function homonyms(db){
 const byName={};for(const p of db.people)(byName[p.name]=byName[p.name]||[]).push(p.id);
 return Object.entries(byName).filter(([,ids])=>ids.length>1).map(([name,personIds])=>({name,personIds}));
}
function secondhand(db){return db.evidence.filter(e=>M.sourceUsable(db,e)&&/二手转述|自述/.test(e.independence||'')).map(e=>({evidenceId:e.id,independence:e.independence,jobIds:db.jobs.filter(j=>j.evidenceIds.includes(e.id)).map(j=>j.id)}));}
function orgDiagnosis(db){
 const b=bench(db),py=pyramid(db),mid=py.find(x=>x.rank===2),lead=py.find(x=>x.rank===3);

  pyramidInverted:!!(mid&&lead&&mid.people<lead.people),
  notice:'全部结构指标仅由已发布任职与当前有效字段证据计算，描述的是样本库的收录情况，不是任何团队的真实编制、稳定性或人员流失风险。“未收录证据”不等于该项目没有此类岗位；“样本内单点”不等于现实中只有一人。不涉及任何求职意向判断。'};
}

const P=(id,kind,priority,finding,why,action,basis,limit)=>({id,kind,priority,finding,why,action,basis,limit});
function playbook(db){

  if(!thin.length)continue;
  if(!deep.length&&thin.length>=2){out.push(P('thin:'+row.project.id,'扩样 mapping','P2',

</script><script>window.submissionDocs={"prompt": "# MMO Mapping V3.0.0 提取 Prompt\n\n你是中国 MMO 策划人才 Mapping 的资料整理助手。仅基于输入原文和明确给定的既有实体清单提出草案，不直接发布，不使用外部知识补履历。\n\n输入：原文、来源名称／类型、发布时间、采集日、既有人员／公司／项目／任职候选。\n\n输出 JSON：\n1. 人员姓名、花名、稳定人员ID候选与身份待确认点。名称匹配不能自动合并。\n2. 公司／工作室、项目、原文岗位、标准岗位候选、任职开始／结束、时间精度与原文定位。\n3. 个人职责原句、能力域／细分、责任范围、适用场景、对应任职；不知道就写未知。\n4. 每条关系的主体／客体／类型／项目／生效时间／证据原句／缺失证据。区分同项目、明确合作、直接汇报、岗位接替与先后任职。\n5. 来源性质、来源质量建议、来源独立性依据、事实核验状态建议。\n6. 逐项比对：新增、已有一致引用、补充字段、时间冲突。给出既有记录ID和理由，不重复建已有任职。\n7. 每个字段的人工确认点；输出只是待审核提案。\n\n禁止：把2021加入战斗组写成2021起担任组长；把后来负责小组自动写成正式组长Title；把接手部分工作写成职位交接；把同组或汇报方案写成行政直线汇报；把职位或项目成绩写成高级能力；猜测真实求职意向。没有结束日期时不可写成确认现任。\n\n2022—2023正式组长头衔只能由明确补充证据证明，不能回填2021。两段经历引用同一访谈仍是一份来源；两篇不同文本不自动判定独立。禁止使用模型自报95%置信度替代证据质量。\n\n实施声明：本轮使用三份完整虚构材料的模拟提案，不是真实AI。真实接口与模型输出导入均未启用。\n\n\n日期约束：演示观察日2026-09-22。第二份团队介绍发布日期2026-09-21。必须满足发布日期≤采集日期≤观察日，未来来源不可作为当期发布证据；系统记录时间单列。2023作为推算的末个完整年不等于精确离任日期。\n\n查询与证据：项目、所属公司、时期、职责能力应共同归属于明确任职；个人曾有战斗职责与曾任主策可由不同经历证明。每组输出任职ID、主张原句及证据ID，不能串用另一个项目的能力来解释所选项目命中。\n\n## V3.0.0 覆盖说明（以前的实时接口排期不适用）\n\n本轮三条预设模拟材料，无真实 OpenAI API。接口 extractIntelligence(input, context) 返回 mode='simulation'、source、originalText、extractedFacts、reviewWarnings、status='待审核'、provenance 与 draft。未识别全文应报错，不能把已知样本答案用于未知输入。\n\n每项字段主张必须有 jobId、personId、projectId、field、value、sourceId、quote、basis、precision、processStatus、factStatus、limitations。basis 区分原文明确／推定边界／未知／职责标准化；正式头衔另附有效期。每个quote必须逐字包含于来源全文。2023为推定最后完整年，不得作为精确截止。头衔补证不继承其他来源的能力、责任范围或任期。\n\n关系来源需 kind、title、published、collected、text、quote、independence、reviewer、有效时期与批准意见。原始线索和审核历史不得抹去。关键词和格式检查不代表真实性或多源独立核验。\n\n第三条花名与岗位冲突：人员ID、任期未知，维持待核验；审核只能暂缓或拒绝，不能按花名强合并。\n", "guide": "# MMO Mapping V3.4.0 · 可核验人才流向\n\n## V3.4：从机构流向总览下钻到逐条证据\n\n参考 `talent.dinq.me` 公开页面呈现的阅读路径——机构流向图、点击机构过滤、Recorded moves 与来源链接——V3.4 将原本“相邻履历即流动”的算法拆为四个状态。没有复用用户 Safari 登录态，也没有宣称复刻该产品的登录后功能或统计公式。\n\n| 状态 | 定义 | 是否计入确认净值 |\n|---|---|---|\n| 明确转岗 | 已发布事件同时关联同一人物、前后任职和项目方向 | 是 |\n| 履历先后 · 待核验 | 相邻跨项目任职不重叠，但没有明确转岗事件 | 否 |\n| 同期跨项目 | 两段任职年份重叠，可能是借调、兼任、外包支持或记录冲突 | 否 |\n| 去向未收录 | 最近任职已结束，库内没有后续记录 | 否；单列，类似 destination pending |\n\n流向页现支持：\n1. 点击项目节点或顶部按钮过滤相关路径和记录；\n2. 绿色实线展示明确转岗，黄色虚线展示履历先后；\n3. 点击边查看构成人物、两段任职、字段主张、事件及来源；\n4. 同期任职单独下钻，避免被误算成项目迁移；\n5. 确认净值仅为明确转岗流入减流出，不混入去向未收录或待核验路径；\n6. 项目时间轴同步分为明确流入/流出、履历先后、同期任职和去向未知。\n\n本版本的策略是**宁可少算，不把履历时间先后冒充转岗**。确认净值仍是虚构样本内的事件统计，不是公司实际人员增减，也不推断离职原因或求职意向。\n\n---\n\n# MMO Mapping V3.3.0 · 组织分析与人才画像\n\n## V3.3 本轮范围：把真实 mapping 的结构规律写进样本\n\n本轮不引入任何真实公司、真实人名或真实个人资料——这既是产品红线，也涉及个人信息合规。引入的是**真实人才 mapping 工作中反复出现的结构规律与数据病理**，用虚构样本承载。\n\n新增 1 家公司（云澜互娱）、2 个项目（《沧溟》《沧溟·归乡》）、8 位人物、13 段任职，每一位都对应一类真实会遇到的情形：\n\n| 情形 | 真实工作中的含义 | 样本中的体现 |\n|---|---|---|\n| 职级自述与公开资料冲突 | 候选人自述职级高于公开名单 | 罗砚：自述主策 vs 名单主策助理，任职待核验，不进任何查询 |\n| 同期兼任 / 借调 | 借调、兼任、跨项目支持 | 裴安：2022–2023 同时在两个项目，流向图会误判为流动 |\n| 离开后回到原公司 | boomerang | 岑野：《玄霄》→《沧溟》→ 回《玄霄》并升任负责人 |\n| 外包或合作方身份归属不明 | 致谢名单里分不清雇主 | 温叙：雇主归属待核验，不计入任何编制统计 |\n| 同名不同人 | 人才库最难回滚的污染源 | 两位「卫楚」，不同项目不同领域，必须按 ID 区分 |\n| 二手转述来源 | 转述、非一手公告 | 尉迟朗：来源独立性标注为二手转述 |\n| 能力域不足以覆盖真实岗位 | 只按四个域分类会漏掉整类岗位 | 能力域由 4 个扩到 7 个，新增关卡与副本、商业化与付费、玩法与系统 |\n\n### 组织分析与建议（新页面）\n\n1. **梯队厚度**：项目 × 能力域矩阵，格内为去重人数，括号内为达到「带领小组 / 模块」及以上的人数。点格子看成员。\n2. **责任层级结构**：按每人达到过的最高责任范围归一层。当前样本出现**层级倒挂**（领域负责多于带组），提醒核查中间层收录覆盖与职级口径；不能据此判断真实组织有问题。\n3. **数据本身的坑**：同名、同期跨项目、来源独立性不足、待核验任职，集中列出。这些是资料问题不是人员问题，不先处理，后面所有名单都会被污染。\n4. **公开行业资料**：把经核查的中国游戏产业报告、GDC 开发者调查、IGDA 署名标准与 LinkedIn 招聘研究列为**背景素材**，逐条说明研究问题与适用边界。公开数据不进入虚构人物事实或查询；点击原始链接才需联网。\n5. **建议行动**：由固定规则推导，分 P0/P1/P2，每条含发现、为什么值得做、建议动作、依据与限制。\n   - 关键判别：**某项目内多个已收录能力域都只有 1 位带组以上时，优先生成一条“检查收录与分工”建议（P2），不逐域报单点风险**；若同项目另有领域已收录 2 位以上，可提出定向补证问题（P1），但仍不能证明市场稀缺或真实编制单点。\n\n### 人才画像\n\n从人物详情或长名单打开，全部由已发布任职与有效字段证据派生：能力域与最高责任范围、轨迹形态（纵深 / 复合）、**成长节奏**（从「参与」到「带组以上」用了几年）、平均任期、涉及品类、跨公司数量、证据强度与使用限制。不推断求职意向，不记录联系方式，待核验任职不计入。\n\n### 本轮明确不做\n\n价值指标驾驶舱、通用自然语言检索修复、项目关系正式补证、研判撤销、真实 AI、团队共享。样本规模仍小，**任何\"市场稀缺\"\"团队不稳定\"\"流失风险\"的结论都不能由本工具得出**。\n\n---\n\n## V3.2 范围（方案 1 + 方案 3）\n\n本轮仅构建本地网页版与独立 HTML，不更新历史公网部署。没有真实 AI、后端或跨设备同步。\n\n1. 打开“需求工作台”→ 新建需求，选择能力域、最低责任范围、是否需主策和项目偏好。\n2. 点击“保存为需求”，填写负责人、业务方、状态与说明。创建时间为实际系统时间，人才事实观察日仍为 2026-09-22；两者不会混用。\n3. 编辑条件或元数据后保存为新版本，修改理由必填。条件变更自动保留字段前后值；可按旧版本口径建立新版本，不覆盖历史。\n4. 点击“记录本次交付”，冻结本次条件、A/B/C 全体名单、命中字段、来源及逐字引文；仅本地记录，不会发送通知。重复相同版本和名单不会重复交付。\n5. 从“版本与历史交付”查看冻结名单并记录业务评价。业务评价不是候选人意向，不影响查询、分层或能力事实。未反馈不视为采纳。\n6. 每个人都进入反向解释：A 全部硬条件有证据，B 部分满足，C 未进入 A/B。C 不是能力不合格，当前全部 26 位虚构样本均可解释。\n7. 原因按“缺少证据 / 已收录范围低于要求 / 项目偏好未命中”分组，每条可查看对应人物。分母是全库去重人数，原因人数不可相加。样本 A 层为空不能证明市场无人或 JD 过严。\n8. 同一人物可加入多个需求人才池，不覆盖全局旧备注。人才池页面按需求筛选；从全局移出会删除原全局跟进记录，但需求曾关联名单保留。\n9. 支持当前解释和历史交付 CSV（包含 C 层及原因），防止公式型文本执行；JSON 含全部需求版本、交付、反馈与关联，可跨文件恢复。\n10. 隔离来源后当前名单重算，历史交付保留且提示失效依据。事实撤销不删除工作记录；旧快照只用于追溯，不能当当前推荐。\n\n需求版本、交付与条件调整是过程记录，不等于业务价值已经实现。本轮不实现价值指标驾驶舱、通用自然语言检索修复、能力域扩展或真实 AI。现有有限关键词搜索仍有未识别条件被忽略的风险；请用本页结构化条件研究。\n\n存储保护：陈旧标签页保存会被阻止，提示先导出再刷新，不做自动合并；迁移/导入/重置先备份并成功写入再替换当前内存，失败不冒报成功。没有账号安全权限。\n\n唯一维护版本为本工程 dist 源代码。脚本将相同代码、CSS、虚构数据、Prompt 和说明嵌入 MMO_Mapping_V3.4.0_独立演示.html，没有维护第二套业务代码。本地 V3.4 初始数据为四家公司、七个项目、二十六位人物、三十九段任职（其中两段待核验，不进入查询；已发布三十七段）；观察日仍为 2026-09-22，全部人物及项目均属虚构。本轮未更新公网旧版本。\n\n## 直接演示\n\n网页版通过公开链接访问，无需登录。备用 HTML 下载后用现代浏览器直接打开，断网也能操作，无需开发服务器。两版不加载外部字体、CDN、模型或 API。HR／业务是演示视角切换，不是账号权限。\n\n0. 驾驶舱先看 P0 窗口信号：《星海纪元》2025 年收缩运营。卡片分三层：①事实（原文与缺口）②信号与判断（HRBP 工作判断，不进入查询）③建议行动、窗口期与复核日。点“去向与流动”查看流向网络与去向未收录人员。\n1. 首页查询“有 MMO 战斗经验且做过主策的人”：初始仅顾航。\n2. 录入新情报，选择第一条完整访谈，点击模拟抽取。四项提案只进入审核区。\n3. 核对林序人员 ID；逐条检查原文。三段任职确认；同项目关系暂缓或拒绝。可修改审核意见、是否保留能力及处理动作。改动岗位、时间、职责必须有独立字段依据；本预设材料不允许用一句审核理由创造事实。\n4. 勾选人工核对并发布：新增两段历史，既有云境主策仅补来源。仍二十六人、总任职四十一段（其中两段待核验、已发布三十九段），查询新增林序；驾驶舱“本轮新增 / 补证”变为 2/1，流向网络出现“玄霄 → 云境（推定，虚线）”。\n5. 查询结果沿“战斗职责经历 → 同一人物 → 主策任职”展示路径，各条件的字段按钮可查看具体引文、来源、时间精度与限制。\n6. 打开林序详情 → 玄霄2022年组织 → 战斗策划组 → 周岚或岗位依据；关键动作旁 ⓘ 分别解释功能、业务价值和数据依据。\n7. 需求长名单选择“主策（需战斗背景）”：A 层为顾航、林序，每人附命中依据、缺口与下一步核验；加入人才池后在看板中更新状态、负责人与复核日。\n8. 数据与备份 → 导出当前 JSON。重置前保存快照；重置后可重复流程，也可恢复备份。\n\n## V3.1 新增：在证据底座上补“所以呢 / 下一步做什么”\n\n借鉴参考 demo 的驾驶舱、事件行动化、流向与可视化，但保持“判断与事实分开”：\n\n- 情报驾驶舱：5 个 KPI（去重人员、本轮新增 / 补证任职、P0 研判、待审核 / 待核验、人才池待复核），均可点开明细；头条窗口信号；数据健康度按字段证据逐项计数（原文明确率、单一来源、推定边界、结束未知、待核验关系、隔离来源），不合成单一分数，点击列出待补证记录。\n- 信号 → 判断 → 建议行动：研判单独存储在 analyses，含优先级 P0/P1/P2、窗口期、复核日、作者；只能挂在有可用来源的已发布事件上；来源隔离后自动隐藏；拒绝写入“强意向 / 可挖性高”类意向推断；保存写版本日志，但不修改任何事实，也不进入查询。\n- 人才流动与能力：同一人相邻两段不同项目的已发布任职构成一次流动；线宽为人数，前段末年推定或未知画虚线；项目净流动与“去向未收录”（任职结束且无后续记录，不等于离职或求职）；项目 × 能力热力图，括号内为带领小组 / 模块及以上人数，点格子进入组合查询，不计算主观稀缺度。\n- 项目页“架构演变”：每年阶段、已收录人数、流入 / 流出、去向未收录与事件；点击年份回到当年组织。项目关系图谱：团队迁移（有原文，实线）与“疑似孵化 / 玩法延续”（线索，虚线待核验），可创建核验任务。\n- 需求长名单：选择预设或自定义能力域、最低责任范围、是否需主策、项目偏好，输出 A 层（硬条件全部有证据）/ B 层（部分满足），每人附命中依据与原文、缺口、下一步核验，并提示“求职意向未知”；可导出 CSV（不含联系方式）。\n- 可行动人才池：待研究 / 待核验 / 可推荐给业务 / 暂不考虑看板；负责人、对应需求、下次复核日、跟进记录；过期复核标红；“可推荐给业务”必须写明依据；推荐依据直接引用已发布经历。\n\n## 第3轮修正\n\n- 字段主张包含对象ID、字段、值、逐字引文、来源ID、处理状态、事实状态、时间精度、依据类型和限制。不是一篇原文给整条履历背书。\n- 林序2021为明确加入时间；2023仅为按2024迁移推定的最后完整年。具体离任月份未知。2024玄霄查询可出现“时间待核验候选”，正式组织不把它计入确认历史骨架。\n- 第二条材料只补2022–2023正式组长头衔，不回填2021。隔离这份来源后，头衔退出查询，第一条访谈支持的历史战斗职责仍保留。反向隔离访谈时，头衔材料不支持2021加入、战斗能力或管理人数。\n- 来源页可填写原因、审核人后隔离／恢复；各页面即时重算。版本撤销保留材料和审计。\n- 关系确认必须有材料类型、标题、发布日期、采集日、全文、逐字引文、独立性说明、审核人、有效时期及批准声明。仅“林序直接向许舟汇报”不足以确认。句式和日期检查不等于事实核实。实线为人工批准虚构材料显示，仍是单一来源。保留初始线索、补证与全部审核历史；暂缓或拒绝不删除人物任职。\n- 第三条“北辰”花名材料有身份与岗位冲突。没有确切任期，不预填任职事实；只可暂缓或拒绝，不新增人物，不强行合并现有人物。\n- 模拟抽取接口 extractIntelligence(input, context) 返回 mode、source、originalText、extractedFacts、reviewWarnings、status、provenance 和 draft。所有样本走同一审核流程。未知文本明确报错并保留输入；没有伪装等待动画、模型调用或真实AI输出。\n\n## 本地状态与可靠恢复\n\n每名访问者使用自己浏览器里的演示副本，没有共享数据库、服务器写入或跨设备同步。同一浏览器同一站点的多个标签页共享存档；避免同时编辑。网上版与文件版不会自动互通；使用“数据与备份”导出 JSON，再在另一版本粘贴 JSON、校验、确认恢复。\n\n浏览器可能限制 file:// 的本地存储，隐私模式也可能不持久保存。启动时检测可写性；不可用时显示“临时体验模式”，仍可完成全部流程。关闭前必须导出 JSON，下次重新打开后导入；临时模式重置前还会下载快照。浏览器提示下载时请保留文件。若中途配额耗尽，页面会显示保存失败，此时也应导出当前 JSON。移动 HTML、换浏览器或清理站点数据可能使原存档不可见，JSON 是跨位置的可靠恢复方式。\n\n所有存档仍用 mmo-mapping-v2 存储键。V3.1（dataVersion=31）迁移到 32 时保留字段 ID、已撤销状态及历史日志原样，新增空 requirements 集合，不按人才池自由文本猜测创建需求。旧事实撤销快照不加入全量 requirements，避免撤销旧事实抹去后建的需求；工作层独立恢复。先显示迁移影响，确认并备份成功后才写入。更旧的 V3.0 存档（dataVersion=30）迁移到 32 时：保留全部审核进度与日志，并入扩充样本、研判、项目关系与人才池跟进字段；历史撤销快照同步补齐扩充样本，撤销旧变更不会丢失新样本。人物、任职和日志不重置；异常未来来源保留但隔离。旧关系批准缺少完整来源元数据的，作为历史意见保留并重新待核验。V1 完全独立。非法导入不覆盖当前数据。\n\n## 可用功能与边界\n\n已实现：情报驾驶舱、信号→判断→行动研判、人才流向与去向未收录、能力热力图、架构演变时间轴、项目关系图谱、需求分层长名单、可行动人才池、公司项目筛选、分时期组织多层下钻、人物履历与能力、组合查询、字段证据、三条模拟提案、人审发布、关系核验、基础人才池、项目关注、核验任务、版本撤销、备份恢复与关键业务入口 ⓘ。源码版和独立版使用相同代码；目前 V3.3 只在本地构建、尚未更新公网。\n\n仍为后续范围：完整CRM、项目关系的正式补证审核、意向线索的独立来源建模、通用任意字段纠错、月度精细组织、自动独立来源验证、真实AI、实时新闻、后台推送、团队共享库和账号权限。本轮没有把预设提案包装成真实AI验收证据。\n\n## 工程与验收\n\nmodel.js 保留基础数据、原有流程与兼容逻辑；claims.js 管理字段证据、审核规则与版本迁移；extraction.js 为模拟适配层；insight.js 为 V3.1 扩充样本、派生指标、长名单、研判与人才池规则；insight-views.js 为 V3.1 页面；requirements.js 管理 V3.2 需求与快照领域，requirements-views.js 管理需求工作台及完整长名单界面；org.js 为虚构组织病理样本与规则诊断，org-views.js 为组织分析和人才画像界面；app.js 为原有页面与路由；help.js 为统一 ⓘ；submission.js 由构建生成。修改源代码后运行 python3 scripts/build.py 同步独立 HTML，禁止手改单文件。\n\n业务测试：Node 运行 tests/model.test.cjs、tests/v21.test.cjs、tests/v3.test.cjs、tests/v31.test.cjs、tests/v32-longlist.test.cjs、tests/v32-requirements.test.cjs、tests/v33-org.test.cjs；legacy-v1、legacy-v2、legacy-v21 保留历史测试。浏览器验收 tests/browser.cjs 对 HTTP、真正 file:// 断网、file:// 存储禁用分别运行相同闭环，含重置重演、导出恢复、关系补证、未知输入和手机布局。V3.2 新流程由 tests/v32-browser.cjs 验证三种环境、迁移、陈旧标签页保护和导入写入失败。详见工程根目录验收记录_V3.1.0.md 中的 V3.2 增量记录与 V3.3 当前验收节，以及 tests/v32-browser-results.json。\n"};

function headline(a){const e=a.event;return `<section class="headline"><div class="headline-main"><div class="row">${prTag(a.priority)}<span class="eyebrow light">人才窗口信号 · ${esc(a.kind)}</span>${a.overdue?tag('已过复核日','red'):''}</div><h2>${esc(e.title)}</h2><p>${esc(a.signal)}</p><p class="headline-action"><b>建议行动</b> ${esc(a.action)}</p><small>${esc(a.window)} · 复核日 ${esc(a.reviewBy||'未设')}　|　事实依据：${esc(e.fact)}</small></div><div class="headline-side">${action('event','事实与变化',`data-id="${e.id}"`,'btn','compare')}${act('nav','去向与流动 →','data-page="flow"','btn ghost')}${projectLink(e.projectId,e.before)}</div></section>`;}

/* ---------------- 人才流动与能力 ---------------- */
function flowNet(f){
 const W=820,H=420,CX=W/2,CY=H/2-6,ps=[...db.projects].sort((a,b)=>a.companyId.localeCompare(b.companyId)||a.start-b.start),pos={},rad={};
 ps.forEach((p,i)=>{const t=-Math.PI/2+i*2*Math.PI/ps.length;pos[p.id]={x:CX+300*Math.cos(t),y:CY+140*Math.sin(t)};rad[p.id]=20+M.projectPeople(db,p.id).length*2;});
 const unit=(x,y)=>{const l=Math.hypot(x,y)||1;return [x/l,y/l];};
 const draw=(e,kind)=>{const a=pos[e.from],b=pos[e.to],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,cx=mx+(CX-mx)*.45,cy=my+(CY-my)*.45,[ux,uy]=unit(cx-a.x,cy-a.y),[vx,vy]=unit(b.x-cx,b.y-cy),sx=a.x+ux*(rad[e.from]+2),sy=a.y+uy*(rad[e.from]+2),ex=b.x-vx*(rad[e.to]+6),ey=b.y-vy*(rad[e.to]+6),w=2+e.count*2.5,key=kind+'|'+e.from+'>'+e.to;return `<g class="flow-edge ${kind==='candidate'?'inferred':''} ${flowFocusProject&&![e.from,e.to].includes(flowFocusProject)?'dim':''}" data-action="flowEdge" data-id="${key}" tabindex="0" role="button" aria-label="${esc(project(e.from).name)}到${esc(project(e.to).name)} ${e.count}人 · ${kind==='confirmed'?'明确转岗':'履历先后'}"><path d="M${sx.toFixed(1)},${sy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" stroke-width="${w}" marker-end="url(#arrow${kind==='candidate'?'I':''})"/><text x="${((sx+2*cx+ex)/4).toFixed(1)}" y="${((sy+2*cy+ey)/4).toFixed(1)}">${e.count}</text></g>`;};
 const edges=[...f.edges.map(e=>draw(e,'confirmed')),...f.candidateEdges.map(e=>draw(e,'candidate'))].join('');
 const nodes=ps.map(p=>{const n=f.net[p.id],r=rad[p.id],o=pos[p.id],below=o.y>=CY,focus=flowFocusProject===p.id;return `<g class="flow-node ${focus?'active':''}" data-action="flowProject" data-id="${p.id}" tabindex="0" role="button" aria-label="筛选${esc(p.name)}流动"><circle cx="${o.x}" cy="${o.y}" r="${r}"/><text x="${o.x}" y="${o.y+5}" class="n1">${esc(p.name)}</text><text x="${o.x}" y="${below?o.y+r+16:o.y-r-22}" class="n3">${esc(db.companies.find(c=>c.id===p.companyId).name)}</text><text x="${o.x}" y="${below?o.y+r+31:o.y-r-8}" class="n2">确认入 ${n.in} · 出 ${n.out} · 待核验 ${n.candidateIn+n.candidateOut}</text></g>`;}).join('');
 return `<div class="flow-wrap"><svg viewBox="0 0 ${W} ${H}" class="flow-svg" role="img" aria-label="项目间人才流向与待核验路径"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2c8a79"/></marker><marker id="arrowI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c09331"/></marker></defs>${edges}${nodes}</svg></div>`;
}
function moveTable(rows,kind){return `<div class="tablewrap"><table><thead><tr><th>路径</th><th>人数</th><th>人员（年份）</th><th>依据</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${projectLink(e.from)} → ${projectLink(e.to)}</td><td>${e.count}</td><td>${e.moves.map(m=>`${personBtn(m.personId)} <small class="muted">${m.year}${m.inferred?' · 边界待核验':''}${m.gap?' · 有空档':''}</small>`).join('<br>')}</td><td>${act('flowEdge',kind==='confirmed'?'明确事件与原文':'先后经历与原文',`data-id="${kind}|${e.from}>${e.to}"`)}</td></tr>`).join('')||'<tr><td colspan="4">暂无。</td></tr>'}</tbody></table></div>`;}
function flowView(){
 const f=M.flows(db),hm=M.heatmap(db),max=Math.max(1,...hm.rows.flatMap(r=>r.cells.map(c=>c.count))),rel=e=>!flowFocusProject||e.from===flowFocusProject||e.to===flowFocusProject,confirmed=f.edges.filter(rel),candidates=f.candidateEdges.filter(rel),concurrent=f.concurrent.filter(x=>!flowFocusProject||x.projectIds.includes(flowFocusProject)),exits=f.exits.filter(x=>!flowFocusProject||x.projectId===flowFocusProject),focus=flowFocusProject&&project(flowFocusProject);
 return `<section class="panel"><div class="panel-head"><div><h2>项目间人才流向网络</h2><p class="muted">${esc(f.method)}</p></div>${info('flow')}</div><div class="actions flow-filter">${act('flowProject','全部项目','data-id=""',flowFocusProject?'btn secondary':'btn')}${db.projects.map(p=>act('flowProject',esc(p.name),`data-id="${p.id}"`,flowFocusProject===p.id?'btn':'btn secondary')).join('')}</div>${focus?`<p class="hint">当前筛选：${esc(focus.name)}。图中弱化无关路径；下方明细仅保留相关记录。</p>`:''}<div class="legend"><span class="solid-sample"></span> 绿色实线：有已发布事件明确关联前后任职 <span class="dashed-sample"></span> 黄色虚线：仅履历先后，待核验 · 线宽 = 去重人数 · 点击节点筛选</div>${flowNet(f)}</section>
 <section class="panel section-space"><div class="panel-head"><h2>明确转岗 · ${confirmed.reduce((n,e)=>n+e.count,0)} 人次</h2>${info('flowConfirmed')}</div>${moveTable(confirmed,'confirmed')}<p class="muted">只有本表参与下方“确认流入 / 流出”。同一人有多次明确转岗时按事件分别计数。</p></section>
 <section class="panel section-space"><div class="panel-head"><h2>履历先后 · 待核验 ${candidates.reduce((n,e)=>n+e.count,0)} 人次</h2>${info('flowCandidate')}</div>${moveTable(candidates,'candidate')}<p class="muted">这里只确认任职先后，未见明确转岗事件；不进入净流量。可沿人物、任职和来源继续补证。</p></section>
 <section class="panel section-space"><div class="panel-head"><h2>同期跨项目 · ${concurrent.length} 条</h2>${info('flowConcurrent')}</div>${concurrent.map(x=>`<div class="task"><div>${personBtn(x.personId)} · ${x.projectIds.map(id=>projectLink(id)).join(' ＋ ')}<p class="muted">${x.start}–${x.end} 年 · ${esc(x.warning)}</p></div>${act('flowConcurrent','查看两段任职',`data-id="${x.id}"`,'link')}</div>`).join('')||'<p class="muted">当前筛选下无同期跨项目任职。</p>'}</section>
 <div class="grid section-space"><section class="panel"><div class="panel-head"><h2>项目确认净流动</h2>${info('flowNet')}</div><div class="tablewrap"><table><thead><tr><th>项目</th><th>确认流入</th><th>确认流出</th><th>待核验路径</th><th>同期任职</th></tr></thead><tbody>${db.projects.filter(p=>!flowFocusProject||p.id===flowFocusProject).map(p=>{const n=f.net[p.id];return `<tr><td>${projectLink(p.id)}</td><td>${n.in}</td><td>${n.out}</td><td>${n.candidateIn+n.candidateOut}</td><td>${n.concurrent}</td></tr>`;}).join('')}</tbody></table></div><p class="muted">确认净值 = 明确转岗流入 − 明确转岗流出。去向未收录单列，不混入净值。</p></section>
 <section class="panel"><div class="panel-head"><h2>去向未收录 · ${exits.length} 人</h2>${info('exits')}</div>${exits.sort((a,b)=>b.year-a.year).map(x=>`<div class="task"><div>${personBtn(x.personId)}<p class="muted">最近已知：${esc(project(x.projectId).name)} · ${esc(M.roleAt(db.jobs.find(j=>j.id===x.jobId),'all',db))} · 止于 ${x.year} 年</p></div><div class="row">${evidenceLink(x.evidenceIds)}${poolButton(x.personId)}</div></div>`).join('')||'<p class="muted">暂无。</p>'}<p class="muted">对应 destination pending：库内没有后续记录，不等于离职、待业或求职。</p></section></div>
 <section class="panel section-space"><div class="panel-head"><h2>能力热力图 · 项目 × 能力域</h2>${info('heatmap')}</div><p class="muted">格内数字 = 该项目有此能力职责证据的去重人数；括号 = 其中责任范围达到“带领小组 / 模块”及以上的人数。点击格子进入组合查询。</p><div class="tablewrap"><table class="heat"><thead><tr><th>项目</th>${hm.domains.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${hm.rows.map(r=>`<tr><td>${projectLink(r.project.id)}<br><small class="muted">${esc(r.project.genre)}</small></td>${r.cells.map(c=>`<td>${c.count?act('heat',`<b>${c.count}</b><small>（${c.leads}）</small>`,`data-project="${r.project.id}" data-cap="${c.domain}" style="background:rgba(34,155,137,${(0.12+0.6*c.count/max).toFixed(2)})"`,'heat-cell'):'<span class="heat-empty">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><th>样本合计</th>${hm.totals.map(t=>`<th>${t.people} 人 · 带组以上 ${t.leads}<br><small>${t.projects} 个项目${t.leads<=2?' · 样本内带组人数少':''}</small></th>`).join('')}</tr></tfoot></table></div><p class="muted">“—”仅表示样本库没有收录该能力的职责证据，不代表项目没有此类人才；不计算主观稀缺度。</p></section>`;
}

/* ---------------- 架构演变 & 项目关系 ---------------- */
function timelineView(p){
 const t=M.timeline(db,p.id),max=Math.max(1,...t.map(x=>x.count));
 return `<section class="panel section-space"><div class="panel-head"><h2>架构演变时间轴 · ${p.start}–${db.observationDate.slice(0,4)}</h2>${info('timeline')}</div><p class="muted">每年：阶段、已收录人数、流入 / 流出与事件，均由已发布任职回算。点击年份查看当年组织。推定边界年份的人数可能包含时间待核验人员。</p><div class="tl">${t.map(y=>`<div class="tl-year ${String(y.year)===projectState.period?'current':''}">${act('tlYear',`<b>${y.year}</b><small>${esc(y.stage)}</small>`,`data-year="${y.year}"`,'tl-head')}<div class="tl-bar" title="${y.count} 人"><span style="height:${Math.max(4,y.count/max*100)}%"></span></div><small class="tl-count">${y.count} 人</small>${y.inflow.map(m=>act('person',`↘ ${esc(person(m.personId).name)}<small>明确转岗来自 ${esc(project(m.from).name)}</small>`,`data-id="${m.personId}"`,'tl-chip in')).join('')}${y.outflow.map(m=>act('person',`↗ ${esc(person(m.personId).name)}<small>明确转岗至 ${esc(project(m.to).name)}${m.inferred?' · 边界待核验':''}</small>`,`data-id="${m.personId}"`,'tl-chip out')).join('')}${y.candidateIn.map(m=>act('person',`? ${esc(person(m.personId).name)}<small>履历先后：来自 ${esc(project(m.from).name)}</small>`,`data-id="${m.personId}"`,'tl-chip candidate')).join('')}${y.candidateOut.map(m=>act('person',`? ${esc(person(m.personId).name)}<small>履历先后：去 ${esc(project(m.to).name)}</small>`,`data-id="${m.personId}"`,'tl-chip candidate')).join('')}${y.concurrent.map(x=>act('flowConcurrent',`∥ ${esc(person(x.personId).name)}<small>同期跨项目，待核验</small>`,`data-id="${x.id}"`,'tl-chip concurrent')).join('')}${y.exits.map(x=>act('person',`… ${esc(person(x.personId).name)}<small>此后去向未收录</small>`,`data-id="${x.personId}"`,'tl-chip exit')).join('')}${y.events.map(e=>act('event','◆ '+esc(e.title),`data-id="${e.id}"`,'tl-chip ev')).join('')}</div>`).join('')}</div><div class="legend section-space"><span class="tl-key in"></span>明确流入 <span class="tl-key out"></span>明确流出 <span class="tl-key candidate"></span>履历先后待核验 <span class="tl-key concurrent"></span>同期跨项目 <span class="tl-key exit"></span>任职结束且去向未收录 <span class="tl-key ev"></span>已发布事件</div></section>${projectLinksPanel(p.id)}`;
}
function projectLinksPanel(pid){const ls=M.linksFor(db,pid);return `<section class="panel section-space"><div class="panel-head"><h2>项目关系图谱</h2>${info('projectLinks')}</div><div class="legend"><span class="solid-sample"></span> 实线：有原文明确支持的项目关系 <span class="dashed-sample"></span> 虚线：待核验线索（不进入正式事实）</div>${ls.map(l=>`<div class="relation-edge ${l.processStatus==='待核验'?'pending':''}"><div class="relation-node">${projectLink(l.fromId)}<small>${esc(db.companies.find(c=>c.id===project(l.fromId).companyId).name)}</small></div>${act('plink',`${l.processStatus==='待核验'?'? 待核验：':''}${esc(l.type)} →`,`data-id="${l.id}"`,'relation-line')}<div class="relation-node">${projectLink(l.toId)}<small>${l.year} 年 · ${esc(l.processStatus)}</small></div></div>`).join('')||'<p class="muted">该项目暂无收录的项目间关系。</p>'}<p class="muted">成员迁移不等于续作或项目血缘；“疑似同一团队 / 玩法延续”只作为线索单独核验。</p></section>`;}

function legacyLonglistView(){
 let rows=[],err='';try{rows=M.longlist(db,longState);}catch(e){err=e.message;}
 const A=rows.filter(r=>r.tier==='A'),Bt=rows.filter(r=>r.tier==='B');
 return `<section class="panel"><div class="panel-head"><h2>招聘需求 → 可解释的分层长名单</h2>${info('longlist')}</div><p class="muted">规则版、可复现：只用已发布任职、能力职责与字段证据匹配，不调用 AI、不评估人才质量或求职意向。A 层 = 全部硬条件满足；B 层 = 至少一项能力有证据但有缺口。</p><div class="tabs">${M.LONGLIST_PRESETS.map(p=>act('llPreset',p.title,`data-id="${p.id}"`,longState.preset===p.id?'active':'')).join('')}</div><form id="longlistForm" class="ll-form"><label class="field">需求名称<input name="title" value="${esc(longState.title)}" maxlength="40"></label><fieldset class="field"><legend>必需能力域（职责证据）</legend><div class="checks">${M.DOMAINS.map(d=>`<label><input type="checkbox" name="domains" value="${d}" ${longState.domains.includes(d)?'checked':''}>${d}</label>`).join('')}</div></fieldset><label class="field">最低责任范围<select name="minScope">${[1,2,3,4].map(n=>`<option value="${n}" ${+longState.minScope===n?'selected':''}>${M.SCOPE_LABEL[n]}</option>`).join('')}</select></label><label class="field">项目类型偏好（不作淘汰）<select name="genre"><option value="">不限</option>${['动作','开放世界','回合制','科幻','东方玄幻'].map(g=>`<option ${longState.genre===g?'selected':''}>${g}</option>`).join('')}</select></label><label class="checks"><span><input type="checkbox" name="chief" ${longState.chief?'checked':''}>需做过主策（可由另一段经历证明）</span></label><div class="actions"><button class="btn">生成长名单 →</button>${rows.length?act('llExport','导出 CSV','','btn secondary'):''}</div></form>${err?`<p class="error" role="alert">${esc(err)}</p>`:''}</section>
 ${err?'':`<section class="panel section-space"><div class="panel-head"><h2>A 层 · 硬条件全部有证据 · ${A.length} 人</h2>${tag('优先研究','green')}</div>${A.map(llCard).join('')||'<p class="empty">暂无全部满足的人员。可放宽责任范围，或审核新情报后再看。</p>'}</section><section class="panel section-space"><div class="panel-head"><h2>B 层 · 部分满足 / 有缺口 · ${Bt.length} 人</h2>${tag('补充研究','amber')}</div>${Bt.map(llCard).join('')||'<p class="muted">暂无。</p>'}</section>`}`;

window.extraModals={
 analysis(m){const e=db.events.find(x=>x.id===m.id),a=(db.analyses||[]).find(x=>x.eventId===m.id)||{priority:'P1',signal:'',judgement:'',action:'',window:'',reviewBy:M.addDays(db.observationDate,90)};return ['研判 · '+esc(e.title),`<div class="layer fact"><span class="layer-label">事实层（只读）</span><p>${esc(e.fact)}</p><p class="muted">缺口：${esc(e.gap)}</p>${evidenceLink(e.evidenceIds)}</div><form id="analysisForm"><input type="hidden" name="eventId" value="${e.id}"><div class="formgrid section-space"><label class="field">优先级<select name="priority">${M.PRIORITIES.map(p=>`<option ${a.priority===p?'selected':''}>${p}</option>`).join('')}</select></label><label class="field">下次复核日<input type="date" name="reviewBy" value="${esc(a.reviewBy||'')}"></label></div><label class="field section-space">信号（这件事改变了什么）<textarea name="signal" required>${esc(a.signal)}</textarea></label><label class="field">判断（对团队 / 人才研究意味着什么）<textarea name="judgement" required>${esc(a.judgement)}</textarea></label><label class="field">建议行动<textarea name="action" required>${esc(a.action)}</textarea></label><label class="field">窗口期（人工设定）<input name="window" required value="${esc(a.window)}"></label><p class="hint">判断层与事实分开存储，不进入查询；不得写入候选人意向推断。保存会写入版本日志。</p><div id="analysisError" class="error" hidden></div><div class="actions"><button class="btn">保存研判</button></div></form>`];},
 analysisList(){const as=M.analyses(db);return ['研判信号 · 按优先级',as.map(a=>analysisCard(a)).join('')||'<p>暂无研判。</p>'];},
 delta(){const js=M.publishedJobs(db),init=id=>evidence(id)?.ingestionKind==='历史底库初始化',rows=js.filter(j=>j.evidenceIds.some(id=>!init(id)));return ['本轮新增 / 补证任职',`<p class="muted">相对“历史底库初始化”的变化，全部由人审发布产生。</p>${rows.map(j=>`<div class="task"><span>${personBtn(j.personId)} · ${esc(project(j.projectId).name)} · ${esc(M.roleAt(j,'all',db))} ${tag(j.evidenceIds.every(id=>!init(id))?'新增任职':'补充证据',j.evidenceIds.every(id=>!init(id))?'green':'amber')}</span>${action('job','字段依据',`data-id="${j.id}" data-year="all"`,'link','evidence')}</div>`).join('')||'<p class="empty">尚无。录入并审核林序访谈后，这里会出现 2 段新增、1 段补证。</p>'}`];},
 health(m){const h=M.health(db).find(x=>x.key===m.id);const jobsHtml=(h.jobIds||[]).map(id=>db.jobs.find(j=>j.id===id)).map(j=>`<div class="task"><span>${personBtn(j.personId)} · ${esc(project(j.projectId).name)} · ${esc(M.roleAt(j,'all',db))} · ${esc(timeText(j))}</span>${action('job','字段依据',`data-id="${j.id}" data-year="all"`,'link','evidence')}</div>`).join('');const relHtml=(h.relationIds||[]).map(id=>{const r=db.relationships.find(x=>x.id===id);return `<div class="task"><span>${esc(person(r.subjectId).name)}—${esc(person(r.objectId).name)} · ${esc(r.type)}</span>${action('relation','核验',`data-id="${r.id}"`)}</div>`;}).join('');return ['数据健康度 · '+esc(h.label),`<p><b>${h.value}/${h.total}</b>（${h.pct}%）</p><p class="hint">${esc(h.note)}</p>${jobsHtml||relHtml||'<p class="muted">没有需要列出的记录。</p>'}`];},
 flowEdge(m){const [kind,path]=m.id.split('|'),[from,to]=path.split('>'),f=M.flows(db),e=(kind==='confirmed'?f.edges:f.candidateEdges).find(x=>x.from===from&&x.to===to),label=kind==='confirmed'?'明确转岗':'履历先后 · 待核验';return [`${esc(project(from).name)} → ${esc(project(to).name)} · ${label} · ${e?e.count:0} 人`,(e?e.moves:[]).map(x=>{const a=db.jobs.find(j=>j.id===x.fromJob),b=db.jobs.find(j=>j.id===x.toJob),ev=x.eventId&&db.events.find(e=>e.id===x.eventId);return `<div class="record"><div class="row spread">${personBtn(x.personId)}${tag(x.status,kind==='confirmed'?'green':'amber')}</div><p>${esc(project(a.projectId).name)} · ${esc(M.roleAt(a,'all',db))} · ${esc(timeText(a))}<br>→ ${esc(project(b.projectId).name)} · ${esc(M.roleAt(b,'all',db))} · ${esc(timeText(b))}</p><p class="muted">${esc(x.basis)}${x.gap?' 两段经历之间有空档年份。':''}</p>${ev?`${action('event','明确转岗事件',`data-id="${ev.id}"`,'link','compare')} `:''}${claimLinks(x.claimIds)} ${evidenceLink(x.evidenceIds)}</div>`;}).join('')+`<p class="hint">${kind==='confirmed'?'该路径有已发布事件同时关联人员和前后任职，参与确认净流量。':'这里只确认任职先后，不参与净流量；补到明确转岗事件前保持待核验。'} 不推断离职原因、团队整体迁移或求职意向。</p>`];},
 flowConcurrent(m){const x=M.flows(db).concurrent.find(x=>x.id===m.id);if(!x)return ['同期任职已变化','<p>请刷新页面后重试。</p>'];return [`同期跨项目 · ${esc(person(x.personId).name)}`,`<p>${esc(x.start)}–${esc(x.end)} 年同时收录于 ${x.projectIds.map(id=>projectLink(id)).join(' 与 ')}。</p><p class="hint">${esc(x.warning)}</p>${x.jobIds.map(id=>action('job','任职 '+esc(id),`data-id="${esc(id)}" data-year="all"`,'link','evidence')).join(' ')} ${claimLinks(x.claimIds)} ${evidenceLink(x.evidenceIds)}<p class="muted section-space">同期重叠不自动判定借调、兼职或记录冲突，也不参与确认流入 / 流出。</p>`];},
 plink(m){const l=M.linksFor(db).find(x=>x.id===m.id)||db.projectLinks.find(x=>x.id===m.id);return [`${esc(project(l.fromId).name)} → ${esc(project(l.toId).name)} · ${esc(l.type)}`,`${tag(l.processStatus,l.processStatus==='待核验'?'amber':'green')} ${tag('虚构演示')}<h3 class="section-space">原文依据</h3><div class="quote">${esc(l.quote)}</div><p class="hint">${esc(l.gap)}</p>${evidenceLink(l.evidenceIds)}<div class="actions">${action('correction','创建核验任务',`data-id="${l.id}" data-kind="projectLink"`,'link','correction')}</div>`];},
 poolEdit(m){const it=M.poolItems(db).find(x=>x.personId===m.id),mm=it.meta;return ['跟进 · '+esc(it.person.name),`<form id="poolForm"><input type="hidden" name="personId" value="${m.id}"><div class="formgrid"><label class="field">跟进状态<select name="status">${M.POOL_STATUS.map(s=>`<option ${mm.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">负责人<input name="owner" required value="${esc(mm.owner)}"></label><label class="field">对应需求<input name="need" value="${esc(mm.need)}"></label><label class="field">下次复核日<input type="date" name="nextReview" value="${esc(mm.nextReview)}"></label></div><label class="field section-space">依据 / 备注（标记“可推荐给业务”时必填）<textarea name="note">${esc(mm.note)}</textarea></label><p class="hint">工作记录不修改人员事实；不得写入意向推断或联系方式。</p><div id="poolError" class="error" hidden></div><div class="actions"><button class="btn">保存跟进</button></div></form><h3 class="section-space">跟进记录</h3>${(mm.history||[]).slice().reverse().map(h=>`<p class="small">${esc(h.date)} · ${esc(h.status)} · ${esc(h.note)}</p>`).join('')||'<p class="muted">暂无</p>'}`];}

 stat(b){const k=b.dataset.key;if(k==='delta')return openModal('delta');if(k==='p0')return openModal('analysisList');if(k==='poolDue')return go('pool');return false;},

</script><script>/* V3.2 requirement workbench. All user data is escaped; no network calls. */
'use strict';
let activeRequirementId='',requirementPoolFilter='';
const requirementNow=()=>db.requirements.find(r=>r.id===activeRequirementId)||null;
const requirementConditions=s=>({domains:[...s.domains].sort(),minScope:+s.minScope,chief:!!s.chief,genre:s.genre||''});
const reqAttr=id=>`data-id="${esc(id)}"`;
const reqDate=s=>esc(String(s).replace('T',' ').slice(0,19)+' UTC');
const reqConditionText=c=>`${c.domains.join(' + ')||'不限能力域'} / ${M.SCOPE_LABEL[c.minScope]}${c.chief?' / 需主策':''}${c.genre?' / 偏好'+c.genre:''}`;
function readRequirementForm(){const form=document.querySelector('#longlistForm');if(!form)return longState;const f=new FormData(form);return {title:String(f.get('title')||'自定义需求').trim(),domains:f.getAll('domains').map(String),minScope:Number(f.get('minScope')),chief:f.has('chief'),genre:String(f.get('genre')||'')};}
function useRequirement(r){activeRequirementId=r.id;longState={title:r.title,...M.clone(r.conditions)};}
function requirementDirty(r,s=longState){return r&&(s.title!==r.title||JSON.stringify(requirementConditions(s))!==JSON.stringify(r.conditions));}
function reqClose(message){if(save()===false)return toast('保存失败：当前更改只在内存中，请先导出 JSON。');modalStack=[];$('#detail').close();render();toast(message);}
function reqGuard(){if(role!=='hr'){toast('需求维护由 HR 视角处理；这不是账号权限。');return false;}return true;}
function requirementsView(){return `<section class="panel"><div class="panel-head"><div><h2>需求工作台</h2><p class="muted">保存口径、记录交付、积累业务反馈。工作记录与人才事实分开。</p></div>${info('requirements')}</div><div class="actions">${act('reqNew','新建需求','','btn')}${act('nav','查看临时长名单','data-page="longlist"','btn secondary')}</div><p class="hint">没有预填业务成绩。交付时间是实际系统记录时间，人才事实观察日仍为 ${esc(db.observationDate)}。仅本地保存，不发送通知。</p></section><div class="req-grid section-space">${db.requirements.map(r=>`<article class="panel"><div class="row spread"><h3>${esc(r.title)}</h3>${tag(r.status)}</div><p class="muted">负责人 ${esc(r.owner)} / 业务方 ${esc(r.requester)}</p><p>${esc(reqConditionText(r.conditions))}</p><p class="small muted">口径 v${r.version} / ${r.deliveries.length} 次交付 / ${r.poolPersonIds.filter(id=>db.pool.includes(id)).length} 位关联人才</p><div class="actions">${act('reqOpen','打开需求',reqAttr(r.id),'btn')}${act('reqHistory','版本与交付',reqAttr(r.id),'link')}${act('reqPool','关联人才池',reqAttr(r.id),'link')}</div></article>`).join('')||'<div class="panel empty">尚未保存需求。新建后选择条件，再保存负责人和业务方，即可冻结第一份交付名单。</div>'}</div>`;}
function longlistView(){
 const r=requirementNow();let report=null,error='';try{report=M.explainLonglist(db,requirementConditions(longState));}catch(e){error=e.message;}
 const dirty=requirementDirty(r),diff=r&&!dirty?M.requirementDiff(db,r.id):null;
 return `<section class="panel"><div class="panel-head"><div><h2>${r?esc(r.title):'临时需求长名单'} ${r?tag('口径 v'+r.version):tag('尚未保存','amber')}</h2><p class="muted">先核对条件，再保存需求；交付只冻结当前名单，不代表已推荐或业务采纳。</p></div>${info('requirements')}</div>
 <div class="actions">${act('nav','需求工作台','data-page="requirements"','link')}${r?act('reqHistory','版本与历史交付',reqAttr(r.id),'link'):''}${act('reqNew','另建需求','','link')}</div>
 ${r?`<p class="small muted">负责人 ${esc(r.owner)} / 业务方 ${esc(r.requester)} / ${esc(r.status)} / 已记录 ${r.deliveries.length} 次交付</p>`:''}
 <div class="tabs">${M.LONGLIST_PRESETS.map(p=>act('llPreset',esc(p.title),reqAttr(p.id),longState.preset===p.id?'active':'')).join('')}</div>
 <form id="longlistForm" class="ll-form"><label class="field">需求名称<input name="title" value="${esc(longState.title)}" maxlength="80" required></label><fieldset class="field"><legend>必需能力域（可多选）</legend><div class="checks">${M.DOMAINS.map(d=>`<label><input type="checkbox" name="domains" value="${esc(d)}" ${longState.domains.includes(d)?'checked':''}>${esc(d)}</label>`).join('')}</div></fieldset><label class="field">最低责任范围<select name="minScope">${[1,2,3,4].map(n=>`<option value="${n}" ${+longState.minScope===n?'selected':''}>${M.SCOPE_LABEL[n]}</option>`).join('')}</select></label><label class="field">项目类型偏好（不淘汰）<select name="genre"><option value="">不限</option>${['动作','开放世界','回合制','科幻','东方玄幻'].map(g=>`<option ${longState.genre===g?'selected':''}>${g}</option>`).join('')}</select></label><label class="checks"><span><input type="checkbox" name="chief" ${longState.chief?'checked':''}>需做过主策（可由另一段经历证明）</span></label><div class="actions"><button class="btn">重新计算</button>${role==='hr'?act('reqSave',r?'保存需求 / 新版本':'保存为需求','','btn secondary'):''}${r&&role==='hr'?act('reqDeliver','记录本次交付','','btn secondary'):''}${report?act('llExport','导出当前解释 CSV','','link'):''}</div></form>
 ${error?`<p class="error">${esc(error)}</p>`:''}${dirty?'<p class="hint">当前条件为未保存预览；请先保存新版本再交付。旧版本与旧名单保持不变。</p>':''}</section>

 <h3 class="section-space">证据强度</h3>

</script><script>'use strict';

 $('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">M</span> MMO Mapping</div><div class="side-label">核心策划人才观察 · V3.4.0</div><nav class="nav">${[['home','◫','情报驾驶舱'],['search','⌕','关联人才查询'],['requirements','需','需求工作台'],['longlist','☰','需求长名单'],['flow','⇄','人才流动与能力'],['org','◎','组织分析与建议'],['projects','▦','公司与项目'],['review','☷','审核与待办'],['pool','◇','我的人才池'],['logs','↺','版本与更新'],['data','⇩','数据与备份']].filter(([p])=>role==='hr'||!['review','logs','data'].includes(p)).map(([p,i,t])=>act('nav',`<span class="nav-icon">${i}</span>${t}${p==='review'?` <span class="count">${pending()}</span>`:p==='pool'&&M.poolItems(db).some(i=>i.overdue)?` <span class="count">${M.poolItems(db).filter(i=>i.overdue).length}</span>`:''}`,`data-page="${p}"`,page===p||p==='projects'&&page==='project'?'active':'')).join('')}</nav><div class="side-bottom">字段证据 · 判断分层 · 流向洞察<br>虚构演示 / 数据版本 V${db.revision}<br>${act('nav','方案说明 ↗','data-page="about"')}</div></aside><main class="main"><header class="topbar"><span class="eyebrow">WORKSPACE / MMO TALENT</span><div class="row">${tag('虚构演示','amber')}<select id="role" class="role" aria-label="切换演示视角"><option value="hr" ${role==='hr'?'selected':''}>HR 工作台 · 视角模拟</option><option value="biz" ${role==='biz'?'selected':''}>业务洞察 · 视角模拟</option></select>${info('role')}</div></header><div class="content">${bodyHeading(names[page],page==='home'?'市场信号 → 组织变化 → 人才窗口 → 下一步行动；每一步都能回到原文。':'同一组事实 · 保留时间、依据与不确定性')}<div class="notice">${tag('V3.4.0')}<span>${storageError||(memoryMode?'临时体验模式：浏览器禁止本地存储，关闭页面会丢失进度。请在数据与备份中导出 JSON，下次导入恢复。':'进度仅保存在本浏览器；同一浏览器同站点的标签页共享，其他访问者互不影响。文件移动或更换浏览器请用 JSON 迁移。')} 观察日 ${db.observationDate} · 全部资料虚构 · 视角模拟非账号安全权限。</span></div>${({home,projects:projectsView,project:projectView,search:searchView,intake,review,logs:logsView,pool:poolBoard,about,data:dataView,requirements:requirementsView,longlist:longlistView,flow:flowView,org:orgAnalysisView}[page])()}<footer class="footer"><span>MMO Mapping }
function renderUpgrade(){const preview=M.migrateDatabase(db);$('#app').innerHTML=`<main class="migration"><div class="brand dark">MMO Mapping V3.4.0</div><section class="panel section-space"><h1>旧版本存档迁移预览（→ V3.4.0）</h1><p>保留 ${db.people.length} 位人员、${db.jobs.length} 段任职、${db.logs.length} 条审核日志与全部审核进度。迁移后共 ${preview.people.length} 位人员、${preview.jobs.length} 段任职（并入 V3.1 扩充虚构样本）、${preview.fieldClaims.length} 条字段主张，补齐 V3.2 需求集合（保存口径版本、冻结交付、反馈与需求人才池）。已有事实、审核进度和旧交付不改写；人才池中的自由文本需求不会自动合并。</p><div class="hint">旧来源日期异常 ${preview.evidence.filter(e=>e.quarantined).length} 份：保留原始文本和日期，隔离于有效查询与组织；后续补证。旧日期不自动改写。历史初始化材料不计新采集。</div><div class="actions">${action('exportV2','先导出原始 V2 JSON','','btn secondary')}${act('upgrade','保存可恢复备份并迁移 V3.4.0','','btn')}</div><p class="muted">确认前不写入任何存储。V1 原存档不变。</p></section></main>`;}
function renderMigration(){ $('#app').innerHTML=`<main class="migration"><div class="brand dark"><span class="brandmark">M</span> MMO Mapping V2</div><section class="panel section-space"><span class="eyebrow">保留旧记录，再进入新演示</span><h1 class="section-space">${legacy?'检测到 V1 本地记录':'本地数据需要检查'}</h1><p>V2 使用另一个虚构世界：曜辰互动的《玄霄》《云境》，以及沧澜游戏的《灵域传说》。不会把旧人物改名，也不会把两组数据混在一起。</p><div class="hint">V1 原存储键不修改。先导出旧记录可作为独立备份；加载 V2 只创建新的存储键。${esc(storageError)}</div><div class="actions">${action('exportLegacy','导出 V1 原始备份','','btn secondary')}${act('loadV2','保留 V1，加载 V2 示例','','btn')}${info('migration')}</div></section></main>`;}
